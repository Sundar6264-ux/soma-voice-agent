; Rendered from asterisk/templates/extensions.conf by asterisk/render.py.
; Every inbound call: ask the app for a call id, hand the audio to it over
; AudioSocket, then hang up or transfer to the one staff number configured here.
; Nothing else can be dialled, so a compromised call path cannot run up a bill.

[general]
static = yes
writeprotect = yes

[globals]
APP = http://127.0.0.1:@@APP_PORT@@
TOKEN = @@ASTERISK_TOKEN@@
STAFF = @@STAFF_DIAL@@
AUDIOSOCKET = 127.0.0.1:@@AUDIOSOCKET_PORT@@

[from-trunk]
exten => _X.,1,Set(__DID=${EXTEN})
 same => n,Goto(rva-call,s,1)
exten => _+X.,1,Set(__DID=${EXTEN})
 same => n,Goto(rva-call,s,1)
exten => s,1,Set(__DID=s)
 same => n,Goto(rva-call,s,1)

[from-softphone]
; Any number dialled from the Tailscale phone app reaches the agent. There is no caller ID,
; so the agent asks for a callback number, as it would for a withheld number.
exten => _X.,1,Set(__DID=softphone)
 same => n,Set(CALLERID(num)=)
 same => n,Goto(rva-call,s,1)
exten => s,1,Set(__DID=softphone)
 same => n,Set(CALLERID(num)=)
 same => n,Goto(rva-call,s,1)

[rva-call]
exten => s,1,NoOp(Inbound call from ${CALLERID(num)} to ${DID})
 same => n,Set(CURLOPT(conntimeout)=2)
 same => n,Set(CURLOPT(httptimeout)=4)
 same => n,Set(CALL_ID=${CURL(${APP}/asterisk/start?token=${TOKEN}&from=${URIENCODE(${CALLERID(num)})}&to=${URIENCODE(${DID})})})
 same => n,GotoIf($[${LEN(${CALL_ID})} != 36]?busy)
 same => n,Answer()
 same => n,AudioSocket(${CALL_ID},${AUDIOSOCKET})
 same => n,Set(NEXT=${CURL(${APP}/asterisk/next?token=${TOKEN}&call=${CALL_ID})})
 same => n,GotoIf($["${NEXT}" = "transfer" & ${LEN(${STAFF})} > 0]?transfer)
 same => n,Hangup()
 same => n(transfer),Dial(PJSIP/${STAFF}@trunk,25)
 same => n,Hangup()
 same => n(busy),Answer()
 same => n,Playback(all-circuits-busy-now)
 same => n,Hangup()
