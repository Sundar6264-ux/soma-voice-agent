; Load what the package ships, minus every module that opens a network port we
; do not use. Only PJSIP (SIP to the carrier) and RTP should listen.
[modules]
autoload=yes
noload => chan_iax2.so
noload => pbx_dundi.so
noload => chan_unistim.so
noload => chan_skinny.so
noload => chan_mgcp.so
noload => chan_motif.so
noload => res_xmpp.so
noload => res_ari.so
noload => res_http_websocket.so
noload => res_pjsip_phoneprov_provider.so
noload => res_phoneprov.so
noload => res_hep.so
noload => res_hep_pjsip.so
noload => res_hep_rtcp.so
