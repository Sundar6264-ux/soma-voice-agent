; Rendered from asterisk/templates/pjsip.conf plus asterisk/parts/ by asterisk/render.py.
; Contains passwords: never commit the rendered copy.
;
; Inbound only. There is no anonymous endpoint: a SIP request is accepted only from
; the carrier's addresses (trunk) or from an authenticated app on Tailscale (softphone).

[global]
type = global
user_agent = rva

[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:@@SIP_PORT@@
local_net = @@LOCAL_NET@@
local_net = 127.0.0.1/32
; Tailscale addresses are reached directly, never through the public IP.
local_net = 100.64.0.0/10
@@EXTERNAL_LINES@@

@@TRUNK@@

@@SOFTPHONE@@
