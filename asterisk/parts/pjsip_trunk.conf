; Carrier line (Telnyx or VoIP.ms). Only the carrier's IP ranges are identified as this endpoint.
[trunk-auth]
type = auth
auth_type = userpass
username = @@SIP_USERNAME@@
password = @@SIP_PASSWORD@@

[trunk-reg]
type = registration
transport = transport-udp
outbound_auth = trunk-auth
server_uri = sip:@@SIP_SERVER@@
client_uri = sip:@@SIP_USERNAME@@@@@SIP_SERVER@@
contact_user = @@SIP_USERNAME@@
; Short expiry plus qualify keeps the home router's NAT mapping open.
expiration = 120
retry_interval = 60
forbidden_retry_interval = 600
line = yes
endpoint = trunk

[trunk]
type = aor
contact = sip:@@SIP_SERVER@@
qualify_frequency = 25

[trunk]
type = endpoint
transport = transport-udp
context = from-trunk
disallow = all
allow = ulaw
outbound_auth = trunk-auth
aors = trunk
direct_media = no
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes
from_user = @@SIP_USERNAME@@
from_domain = @@SIP_SERVER@@
dtmf_mode = rfc4733

[trunk]
type = identify
endpoint = trunk
@@MATCH_LINES@@
