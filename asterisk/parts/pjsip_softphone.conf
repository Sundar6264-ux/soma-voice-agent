; A SIP app on your phone over Tailscale (free testing, no carrier). It must log in with
; this username and password, and both its traffic and its registered contact must come
; from a Tailscale address (100.64.0.0/10). Calls from it go straight to the agent.

[softphone-auth]
type = auth
auth_type = userpass
username = @@SOFTPHONE_USER@@
password = @@SOFTPHONE_PASSWORD@@

[@@SOFTPHONE_USER@@]
type = aor
max_contacts = 1
remove_existing = yes
qualify_frequency = 30

[@@SOFTPHONE_USER@@]
type = endpoint
transport = transport-udp
context = from-softphone
disallow = all
allow = ulaw
auth = softphone-auth
aors = @@SOFTPHONE_USER@@
direct_media = no
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes
dtmf_mode = rfc4733
deny = 0.0.0.0/0
permit = 100.64.0.0/10
contact_deny = 0.0.0.0/0
contact_permit = 100.64.0.0/10
